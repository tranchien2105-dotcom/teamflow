services:
  next:
    build:
      context: ./next-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    container_name: teamflow-next
    restart: unless-stopped

    environment:
      NODE_ENV: production
      LARAVEL_API_URL: ${LARAVEL_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    # Cho container Next resolve api.teamflow.local
    # về host Docker thay vì 127.0.0.1 bên trong container
    extra_hosts:
      - "api.teamflow.local:host-gateway"

    expose:
      - "3000"

    depends_on:
      - laravel

  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod

    container_name: teamflow-laravel
    restart: unless-stopped

    working_dir: /var/www/html

    environment:
      APP_NAME: TeamFlow
      APP_ENV: production
      APP_DEBUG: false

      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}

      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      APP_FAKER_LOCALE: en_US

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: false
      SESSION_PATH: /
      SESSION_DOMAIN: ${SESSION_DOMAIN}

      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local

    # Share uploaded files with Nginx
    volumes:
      - laravel_storage:/var/www/html/storage/app/public

    expose:
      - "9000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

  postgres:
    image: postgres:17-alpine

    container_name: teamflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    # Expose PostgreSQL to the host machine
    # Windows/Navicat -> 127.0.0.1:5433 -> Docker PostgreSQL:5432
    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine

    container_name: teamflow-redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine

    container_name: teamflow-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Laravel public directory
      - ./backend/public:/var/www/html/public:ro

      # Share Laravel uploaded files with Nginx
      - laravel_storage:/var/www/html/storage/app/public:ro

    depends_on:
      - next
      - laravel

volumes:
  postgres_data:
  laravel_storage: