name: TeamFlow CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  laravel:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: teamflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d teamflow_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7

        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP 8.3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pgsql, pdo_pgsql, redis
          coverage: none

      # 3. Create .env from .env.example
      - name: Copy environment file
        run: cp .env.example .env

      # 4. Configure CI environment
      - name: Configure environment
        run: |
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=teamflow_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=postgres/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=postgres/' .env

          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/' .env
          sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env

      # 5. Install Composer dependencies
      #    Includes require-dev => PHPUnit
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # 6. Generate Laravel application key
      - name: Generate application key
        run: php artisan key:generate

      # 7. Run database migrations
      - name: Run migrations
        run: php artisan migrate --force

      # 8. Run Laravel tests
      - name: Run tests
        run: php artisan test
