services:
  next:
    image: node:22
    container_name: teamflow-next
    working_dir: /app
    tty: true
    stdin_open: true
    env_file:
      - ./next-app/.env.local
    environment:
      LARAVEL_API_URL: ${LARAVEL_API_URL:-http://laravel:8000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./next-app:/app
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
      - mailpit

  laravel:
    build:
      context: ./backend
    container_name: teamflow-laravel
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    tty: true
    stdin_open: true
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: teamflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: teamflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    container_name: teamflow-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_WEB_PORT}:8025"

volumes:
  postgres_data: